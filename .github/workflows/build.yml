name: build
on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew build
      - name: Pick the mod jar
        run: |
          mkdir -p out
          cp "$(ls build/libs/*.jar | grep -v -e sources -e dev | head -n 1)" out/classes.jar
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          files: out/classes.jar
